<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<header class="profile-header">

    <a href="index.html" class="logo">

        <img
            src="images/image.png"
            alt="Movie Hub">

    </a>


    <a
        href="index.html"
        class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Home

    </a>

</header>


<!-- PROFILE -->

<main class="profile-page">

    <div class="profile-card">

        <div class="profile-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <h1>
            My Profile
        </h1>


        <p class="profile-subtitle">
            Manage your account details
        </p>


        <!-- USER DETAILS -->

        <div class="profile-details">


            <!-- NAME -->

            <div class="profile-row">

                <i class="fa-solid fa-user"></i>

                <div>

                    <span>
                        Name
                    </span>

                    <strong id="profileName">
                        Not Available
                    </strong>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="profile-row">

                <i class="fa-solid fa-envelope"></i>

                <div>

                    <span>
                        Email
                    </span>

                    <strong id="profileEmail">
                        Not Available
                    </strong>

                </div>

            </div>


            <!-- MOBILE -->

            <div class="profile-row">

                <i class="fa-solid fa-phone"></i>

                <div>

                    <span>
                        Mobile Number
                    </span>

                    <strong id="profileMobile">
                        Not Available
                    </strong>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="profile-row">

                <i class="fa-solid fa-lock"></i>

                <div>

                    <span>
                        Password
                    </span>

                    <strong id="profilePassword">
                        ••••••••
                    </strong>

                </div>

            </div>


        </div>


        <!-- BUTTONS -->

        <button
            class="edit-profile-btn"
            onclick="editProfile()">

            <i class="fa-solid fa-pen"></i>

            Edit Profile

        </button>


        <button
            class="logout-btn"
            onclick="logoutUser()">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>

    </div>

</main>


<script>

/* LOAD PROFILE */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const isLoggedIn =
            localStorage.getItem("isLoggedIn");


        /* CHECK LOGIN */

        if (isLoggedIn !== "true") {

            alert(
                "Please sign in first."
            );

            window.location.href =
                "index.html";

            return;

        }


        /* GET USER DETAILS */

        const userName =
            localStorage.getItem("userName") ||
            "Not Available";


        const userEmail =
            localStorage.getItem("userEmail") ||
            "Not Available";


        const userMobile =
            localStorage.getItem("userMobile") ||
            "Not Available";


        /* DISPLAY DETAILS */

        document.getElementById(
            "profileName"
        ).textContent =
            userName;


        document.getElementById(
            "profileEmail"
        ).textContent =
            userEmail;


        document.getElementById(
            "profileMobile"
        ).textContent =
            userMobile;


        /* PASSWORD IS HIDDEN */

        document.getElementById(
            "profilePassword"
        ).textContent =
            "••••••••";

    }
);


/* EDIT PROFILE */

function editProfile() {

    const currentName =
        localStorage.getItem("userName") || "";


    const currentEmail =
        localStorage.getItem("userEmail") || "";


    const currentMobile =
        localStorage.getItem("userMobile") || "";


    const currentPassword =
        localStorage.getItem("userPassword") || "";


    /* NAME */

    const newName =
        prompt(
            "Enter your name:",
            currentName
        );


    if (
        newName !== null &&
        newName.trim() !== ""
    ) {

        localStorage.setItem(
            "userName",
            newName.trim()
        );

    }


    /* EMAIL */

    const newEmail =
        prompt(
            "Enter your email:",
            currentEmail
        );


    if (
        newEmail !== null &&
        newEmail.trim() !== ""
    ) {

        localStorage.setItem(
            "userEmail",
            newEmail.trim()
        );

    }


    /* MOBILE */

    const newMobile =
        prompt(
            "Enter your mobile number:",
            currentMobile
        );


    if (
        newMobile !== null &&
        newMobile.trim() !== ""
    ) {

        localStorage.setItem(
            "userMobile",
            newMobile.trim()
        );

    }


    /* PASSWORD */

    const newPassword =
        prompt(
            "Enter your password:",
            currentPassword
        );


    if (
        newPassword !== null &&
        newPassword.trim() !== ""
    ) {

        localStorage.setItem(
            "userPassword",
            newPassword.trim()
        );

    }


    /* REFRESH */

    location.reload();

}


/* LOGOUT */

function logoutUser() {

    localStorage.removeItem(
        "userName"
    );

    localStorage.removeItem(
        "userEmail"
    );

    localStorage.removeItem(
        "userMobile"
    );

    localStorage.removeItem(
        "userPassword"
    );

    localStorage.removeItem(
        "isLoggedIn"
    );


    alert(
        "You have been logged out."
    );


    window.location.href =
        "index.html";

}

</script>

</body>

</html>
