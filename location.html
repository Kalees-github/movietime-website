<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select City</title>

    <link rel="stylesheet" href="location.css">

</head>

<body>

<!-- HEADER -->

<header class="location-header">

    <button class="back-button" onclick="goBack()">
        &#10094;
    </button>

    <h1>Select Your City</h1>

</header>


<!-- LOCATION PAGE -->

<main class="location-page">

    <div class="location-container">

        <h2>Search for your city</h2>


        <!-- SEARCH -->

        <div class="city-search">

            <span>🔍</span>

            <input
                type="text"
                id="citySearch"
                placeholder="Search for your city"
                onkeyup="searchCity()"
            >

        </div>


        <!-- DETECT LOCATION -->

        <button
            class="detect-location"
            onclick="detectLocation()">

            📍 Detect my location

        </button>


        <hr>


        <!-- POPULAR CITIES -->

        <h2 class="popular-title">
            Popular Cities
        </h2>


        <div class="city-list" id="cityList">

            <div class="city" onclick="selectCity('Mumbai')">
                <div class="city-icon">🏙️</div>
                <span>Mumbai</span>
            </div>

            <div class="city" onclick="selectCity('Delhi-NCR')">
                <div class="city-icon">🏙️</div>
                <span>Delhi-NCR</span>
            </div>

            <div class="city" onclick="selectCity('Bengaluru')">
                <div class="city-icon">🏙️</div>
                <span>Bengaluru</span>
            </div>

            <div class="city" onclick="selectCity('Hyderabad')">
                <div class="city-icon">🏙️</div>
                <span>Hyderabad</span>
            </div>

            <div class="city" onclick="selectCity('Chandigarh')">
                <div class="city-icon">🏙️</div>
                <span>Chandigarh</span>
            </div>

            <div class="city" onclick="selectCity('Ahmedabad')">
                <div class="city-icon">🏙️</div>
                <span>Ahmedabad</span>
            </div>

            <div class="city" onclick="selectCity('Pune')">
                <div class="city-icon">🏙️</div>
                <span>Pune</span>
            </div>

            <div class="city" onclick="selectCity('Chennai')">
                <div class="city-icon">🏙️</div>
                <span>Chennai</span>
            </div>

            <div class="city" onclick="selectCity('Coimbatore')">
                <div class="city-icon">🏙️</div>
                <span>Coimbatore</span>
            </div>

            <div class="city" onclick="selectCity('Kochi')">
                <div class="city-icon">🏙️</div>
                <span>Kochi</span>
            </div>

        </div>

    </div>

</main>


<script src="location.js"></script>

</body>

</html>
