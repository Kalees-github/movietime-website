<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment - Movie Hub</title>

    <link rel="stylesheet"
          href="payment.css">

</head>

<body>

<!-- HEADER -->

<header class="payment-header">

    <div class="header-left">

        <button
            class="back-button"
            onclick="goBack()">

            &#10094;

        </button>

        <div>

            <h1>Payment</h1>

            <p>Complete your booking</p>

        </div>

    </div>

    <div class="secure-payment">

        🔒 Secure Payment

    </div>

</header>


<!-- MAIN PAYMENT CONTAINER -->

<main class="payment-container">

    <!-- BOOKING DETAILS -->

    <section class="booking-details">

        <h2>Booking Summary</h2>

        <div class="movie-name">

            <h3 id="movieName">
                Jana Nayagan
            </h3>

            <span>
                🎬 Movie Ticket
            </span>

        </div>

        <div class="detail-row">

            <span>
                Date
            </span>

            <strong id="selectedDate">
                -
            </strong>

        </div>

        <div class="detail-row">

            <span>
                Theatre
            </span>

            <strong id="selectedTheatre">
                -
            </strong>

        </div>

        <div class="detail-row">

            <span>
                Show Time
            </span>

            <strong id="selectedTime">
                -
            </strong>

        </div>

        <div class="detail-row">

            <span>
                Seats
            </span>

            <strong id="selectedSeats">
                -
            </strong>

        </div>

    </section>


    <!-- PAYMENT SECTION -->

    <section class="payment-box">

        <h2>Choose Payment Method</h2>

        <!-- UPI -->

        <div class="payment-option">

            <label>

                <input
                    type="radio"
                    name="paymentMethod"
                    value="UPI"
                    checked
                    onclick="selectPayment('UPI')"
                >

                <span>
                    📱 UPI
                </span>

            </label>

        </div>


        <!-- CARD -->

        <div class="payment-option">

            <label>

                <input
                    type="radio"
                    name="paymentMethod"
                    value="Card"
                    onclick="selectPayment('Card')"
                >

                <span>
                    💳 Credit / Debit Card
                </span>

            </label>

        </div>


        <!-- NET BANKING -->

        <div class="payment-option">

            <label>

                <input
                    type="radio"
                    name="paymentMethod"
                    value="Net Banking"
                    onclick="selectPayment('Net Banking')"
                >

                <span>
                    🏦 Net Banking
                </span>

            </label>

        </div>


        <!-- UPI DETAILS -->

        <div
            class="payment-form"
            id="upiForm">

            <label>
                UPI ID
            </label>

            <input
                type="text"
                id="upiId"
                placeholder="example@upi"
            >

        </div>


        <!-- CARD DETAILS -->

        <div
            class="payment-form hidden"
            id="cardForm">

            <label>
                Card Number
            </label>

            <input
                type="text"
                id="cardNumber"
                placeholder="1234 5678 9012 3456"
                maxlength="19"
            >

            <div class="card-row">

                <div>

                    <label>
                        Expiry Date
                    </label>

                    <input
                        type="text"
                        id="expiry"
                        placeholder="MM/YY"
                        maxlength="5"
                    >

                </div>

                <div>

                    <label>
                        CVV
                    </label>

                    <input
                        type="password"
                        id="cvv"
                        placeholder="123"
                        maxlength="3"
                    >

                </div>

            </div>

        </div>


        <!-- NET BANKING -->

        <div
            class="payment-form hidden"
            id="netBankingForm">

            <label>
                Select Bank
            </label>

            <select id="bank">

                <option value="">
                    Select your bank
                </option>

                <option value="SBI">
                    State Bank of India
                </option>

                <option value="HDFC">
                    HDFC Bank
                </option>

                <option value="ICICI">
                    ICICI Bank
                </option>

                <option value="Axis">
                    Axis Bank
                </option>

            </select>

        </div>

    </section>


    <!-- PRICE SUMMARY -->

    <section class="price-section">

        <h2>Price Details</h2>

        <div class="price-row">

            <span>
                Ticket Price
            </span>

            <strong id="ticketPrice">
                $0.00
            </strong>

        </div>

        <div class="price-row">

            <span>
                Convenience Fee
            </span>

            <strong id="convenienceFee">
                $0.00
            </strong>

        </div>

        <div class="price-row total">

            <span>
                Total Amount
            </span>

            <strong id="totalAmount">
                $0.00
            </strong>

        </div>

        <button
            class="pay-button"
            onclick="makePayment()">

            Pay Now

        </button>

    </section>

</main>


<!-- JAVASCRIPT -->

<script src="payment.js"></script>

</body>

</html>
